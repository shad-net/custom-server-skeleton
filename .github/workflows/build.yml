name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reuse:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - uses: fsfe/reuse-action@v6

  clang-format:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7

    # The PyPI wheel pins an exact clang-format, the same on every runner, without adding an
    # apt repository (apt-key is gone on Ubuntu 24.04).
    - name: Install clang-format 19
      run: pipx install clang-format==19.1.7

    # Uses .clang-format at the repository root.
    - name: Check formatting
      run: |
        clang-format --version
        find src \( -name '*.cpp' -o -name '*.h' \) -print0 \
          | xargs -0 clang-format --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            artifact: game-server-linux
          - name: Windows
            os: windows-2022
            artifact: game-server-windows

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: '6.12.0'
          aqtversion: '==3.3.0'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp build/game-server README.md dist/

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/* dist/ -Recurse
          Copy-Item README.md dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
